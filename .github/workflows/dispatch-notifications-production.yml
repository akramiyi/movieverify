name: Notification Dispatch Cycle (Production Scheduler)

on:
  schedule:
    # Every 5 minutes, offset away from the start of the hour (minutes 2, 7, 12, 17, 22, 27, 32, 37, 42, 47, 52, 57)
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of notifications to process in this cycle (1-100)'
        required: true
        default: '25'
        type: string

permissions: {}

concurrency:
  group: dispatch-production-worker
  cancel-in-progress: false

jobs:
  dispatch:
    name: Execute Production Dispatch Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: vars.PRODUCTION_NOTIFICATION_DISPATCH_ENABLED == 'true'

    steps:
      - name: Validate & Invoke Production Dispatch Endpoint
        env:
          WORKER_SECRET: ${{ secrets.INTERNAL_WORKER_SECRET }}
          RAW_BATCH_SIZE: ${{ github.event.inputs.batch_size || '25' }}
          CANONICAL_ENDPOINT: 'https://movieverify.vercel.app/api/notifications/dispatch'
        run: |
          set +x
          set -euo pipefail

          # 1. Verify worker secret presence
          if [ -z "${WORKER_SECRET:-}" ]; then
            echo "::error::INTERNAL_WORKER_SECRET secret is not configured in repository."
            exit 1
          fi

          # 2. Strict numeric bounds validation for batch_size (1-100)
          if [[ ! "$RAW_BATCH_SIZE" =~ ^[0-9]+$ ]] || [ "$RAW_BATCH_SIZE" -lt 1 ] || [ "$RAW_BATCH_SIZE" -gt 100 ]; then
            echo "::error::Invalid batch_size: '$RAW_BATCH_SIZE'. Must be an integer between 1 and 100."
            exit 1
          fi

          echo "Target URL: $CANONICAL_ENDPOINT"
          echo "Batch size validated: $RAW_BATCH_SIZE"

          # 3. Construct exact API contract payload safely using jq
          # Contract requires: batch_size, lease_seconds=60, sweep_expired=true
          JSON_PAYLOAD=$(jq -n \
            --argjson bs "$RAW_BATCH_SIZE" \
            '{ batch_size: $bs, lease_seconds: 60, sweep_expired: true }')

          # 4. Invoke endpoint with curl
          # --proto =https: Strict HTTPS protocol enforcement
          # --max-redirs 0: Zero redirect following (prevents credential forwarding)
          # --max-time 30: Client timeout bounded to 30 seconds
          # -s -S: Silent progress, display real errors
          # -w: Capture HTTP response code
          # -o: Suppress response body to prevent secret or user data leakage
          HTTP_STATUS=$(curl \
            --proto "=https" \
            --max-redirs 0 \
            --max-time 30 \
            -s -S \
            -X POST "$CANONICAL_ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "x-worker-secret: $WORKER_SECRET" \
            -d "$JSON_PAYLOAD" \
            -o /dev/null \
            -w "%{http_code}")

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Dispatch invocation failed with HTTP status: $HTTP_STATUS"
            exit 1
          fi

          echo "Production dispatch cycle completed successfully (HTTP 200)."
